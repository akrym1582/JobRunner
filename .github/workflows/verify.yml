name: verify
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/verify.sh
      - run: npm ci
        working-directory: src/JobRunner/clientapp
      - run: npm run export-api && npm run generate-api
        working-directory: src/JobRunner/clientapp
      - run: git diff --exit-code -- src/JobRunner/clientapp/openapi.json src/JobRunner/clientapp/src/api
      - run: npm run lint && npm run format:check && npm test && npm run build
        working-directory: src/JobRunner/clientapp
      - run: npx playwright install --with-deps chromium
        working-directory: src/JobRunner/clientapp
      - run: npm run test:e2e
        working-directory: src/JobRunner/clientapp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/JobRunner.Tests/TestResults/*.trx
            tests/JobRunner.Tests/TestResults/scale.json
            tests/JobRunner.Tests/TestResults/ui-projection.json
            src/JobRunner/clientapp/playwright-report/
            src/JobRunner/clientapp/test-results/
